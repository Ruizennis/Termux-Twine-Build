[project]
name = "termux-twine-build"
version = "0.2.0"
description = "A version of twine and build compatable with Termux"
authors = [{name = "Ruizennis"}]
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: Utilities"
]
dependencies = [
    "twine==6.2.0",
    "build==1.5.1",
    "readme-renderer==41.0",
    "bleach>=6.4.0",
    "requests==2.34.2",
    "requests-toolbelt==1.0.0",
    "packaging>=26.2",
    "urllib3>=2.7.0",
    "pkginfo>=1.12.0",
    "tqdm>=4.67.0",  
]


[project.urls]
Homepage = "https://github.com/Ruizennis/Termux-Twine-Build"
Issues = "https://github.com/Ruizennis/Termux-Twine-Build/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
